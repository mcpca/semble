dynamics:
  name: ParameterisedNewellDaganzoTraffic
  args:
    n: &n 200
    dx: 0.01
    parameter_generator:
      name: Gaussian 
      args:
        # V
        mean: 1.0
        std: 0.1

sequence_generator:
  name: UniformSqWave
  args:
    period: 2
    min: 0.
    max: 1.0

initial_state_generator:
  name: GreenshieldsInitialState
  args:
    n_cells: *n
    n_sections: 8

control_delta: 0.2
